- name: Build unsigned IPA
        script: |
          set -e
          
          # Disable signing in the project file
          cd ios
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*;/DEVELOPMENT_TEAM = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' Runner.xcodeproj/project.pbxproj
          cd ..
          
          # Build with xcodebuild
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios/output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build
          
          # Package into IPA
          APP_PATH=$(find build/ios/output -name "*.app" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p build/ios/unsigned/Payload
          cp -r "$APP_PATH" build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -r Runner.ipa Payload
          ls -lh Runner.ipa
