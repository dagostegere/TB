workflows:
  unsigned-ipa:
    name: Unsigned IPA
    max_build_duration: 60
    environment:
      flutter: 3.22.3
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Pod install
        script: |
          cd ios
          if [ -f "Podfile" ]; then
            pod install
          else
            echo "No Podfile, skipping"
          fi

      - name: Build unsigned IPA
        script: |
          set -e
          flutter build ios --release --no-codesign
          mkdir -p build/ios/unsigned/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -r Runner.ipa Payload
          ls -lh Runner.ipa

    artifacts:
      - build/ios/unsigned/Runner.ipa
