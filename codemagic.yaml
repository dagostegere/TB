workflows:
  unsigned-ipa:
    name: Unsigned IPA
    max_build_duration: 60
    environment:
      flutter: 3.19.6
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Pod install
        script: |
          cd ios
          if [ -f "Podfile" ]; then
            pod install
          else
            echo "No Podfile, skipping"
          fi

      - name: Build unsigned IPA
        script: |
          set -e
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios/output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build
          APP_PATH=$(find build/ios/output -name "*.app" | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p build/ios/unsigned/Payload
          cp -r "$APP_PATH" build/ios/unsigned/Payload/
          cd build/ios/unsigned
          zip -r Runner.ipa Payload
          ls -lh Runner.ipa

    artifacts:
      - build/ios/unsigned/Runner.ipa
